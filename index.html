<script>
const params = new URLSearchParams(window.location.search);
const isAdmin = params.get("admin") === "true";

const canonicalUrl = new URL(window.location.href);
if (canonicalUrl.searchParams.has("admin")) {
  canonicalUrl.searchParams.delete("admin");
  const query = canonicalUrl.searchParams.toString();
  const normalized = canonicalUrl.pathname + (query ? `?${query}` : "") + canonicalUrl.hash;
  window.history.replaceState({}, "", normalized);
}
